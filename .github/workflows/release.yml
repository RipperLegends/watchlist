name: Pre-Release Security & Performance (DAST & Load)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL для сканування (Staging або Prod)'
        required: true
        default: 'https://www.watchlist.pp.ua'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  issues: write
  contents: read

jobs:
  dast-scan:
    name: 🕷️ DAST (OWASP ZAP) Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ github.event.inputs.target_url || 'https://www.watchlist.pp.ua' }}
          fail_action: false # Змініть на true, якщо хочете жорстко блокувати реліз при знаходженні вразливостей

  load-test:
    name: 🚀 Load Testing (k6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 load test
        run: k6 run tests/load-test.js
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://www.watchlist.pp.ua' }}
