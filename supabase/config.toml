# Remote Auth configuration for Watchlist.
# Secrets are managed through `supabase secrets set`, not in this file.
project_id = "watchlist"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/login",
  "http://localhost:3000/profile",
  "http://localhost:3000/reset-password",
  "https://listwatch.vercel.app/login",
  "https://listwatch.vercel.app/profile",
  "https://listwatch.vercel.app/reset-password",
  "https://watchlist.pp.ua/login",
  "https://watchlist.pp.ua/profile",
  "https://watchlist.pp.ua/reset-password"
]
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.email.smtp]
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "no-reply@watchlist.pp.ua"
sender_name = "Watchlist"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
